<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F2E8"/><stop offset="1" stop-color="#DCE7D2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#27352B" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Beet als geschwungenes Band -->
  <path d="M-40 700 C 180 560, 330 820, 560 690 S 900 520, 1080 600 L 1080 1080 L -40 1080 Z" fill="#7FA36B" opacity=".22"/>
  <g filter="url(#sh)">
    <circle cx="430" cy="470" r="250" fill="#79822F"/>
    <circle cx="690" cy="360" r="150" fill="#F2A1CF"/>
    <circle cx="700" cy="640" r="118" fill="#3B2333"/>
    <circle cx="250" cy="720" r="96" fill="#C9D36B"/>
    <circle cx="560" cy="770" r="62" fill="#DD3C9C"/>
    <circle cx="820" cy="510" r="48" fill="#FFFFFF"/>
  </g>
  <!-- Glanzlichter -->
  <circle cx="430" cy="470" r="250" fill="url(#shine)"/>
  <circle cx="690" cy="360" r="150" fill="url(#shine)"/>
  <circle cx="700" cy="640" r="118" fill="url(#shine)" opacity=".5"/>
</svg>
