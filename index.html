<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#EEF3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kleingarten">
<meta name="description" content="Gartenplan, Pflanzen, Aufgaben und Fotos unseres Kleingartens">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unser Kleingarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F3; --panel:#FFFFFF; --ink:#26322A; --ink-2:#5C6A60; --ink-3:#8D988F;
  --line:#DDE2D8; --sage:#556B4B; --sage-soft:#E8EDE0; --blue:#2F5BD3; --red:#C8424F;
  --accent:#DD3C9C; --sheet-shadow:0 -8px 30px rgba(38,50,42,.12);
  --sans:"Instrument Sans","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --nav-h:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B211D; --panel:#242B26; --ink:#E9EEE6; --ink-2:#B5C0B7; --ink-3:#86928A;
    --line:#38423B; --sage:#9DBB8E; --sage-soft:#2F3A31; --blue:#7FA1FF; --red:#F07C86;
    --sheet-shadow:0 -8px 30px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B211D; --panel:#242B26; --ink:#E9EEE6; --ink-2:#B5C0B7; --ink-3:#86928A;
  --line:#38423B; --sage:#9DBB8E; --sage-soft:#2F3A31; --blue:#7FA1FF; --red:#F07C86;
  --sheet-shadow:0 -8px 30px rgba(0,0,0,.4); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr var(--nav-h);height:100%;position:relative}
header{display:flex;align-items:baseline;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
header h1{margin:0;font:400 26px/1 var(--serif)}
header .sub{color:var(--ink-3);font-size:13px}
header .status{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
main{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* Segmente & Chips */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.05);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chips button .n{opacity:.6;margin-left:4px}
.chips.months button{padding:5px 9px}
.chips button.now{border-color:var(--ink)}

/* Plan */
#planWrap{position:absolute;inset:0;touch-action:none;background:var(--paper);cursor:grab}
#planWrap.dragging{cursor:grabbing}
#plan{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #plan .base{filter:brightness(.82) saturate(.9)}}
:root[data-theme="dark"] #plan .base{filter:brightness(.82) saturate(.9)}
#plan text{font-family:var(--sans)!important}
.plant{cursor:pointer}
.plant .body{vector-effect:non-scaling-stroke;transition:opacity .2s}
.plant.sel .ring{stroke:var(--ink);stroke-width:2.2;fill:none;vector-effect:non-scaling-stroke}
.moving .plant:not(.sel){opacity:.35;pointer-events:none}
.picking .plant:not(.sel) .body{fill-opacity:.28!important;stroke-opacity:.35}
.picking .plant.sel .ring{stroke:var(--blue);stroke-width:3.2;fill:none;vector-effect:non-scaling-stroke}
.picking .plant.sel .body{stroke:var(--blue);stroke-width:1.6}
#labels{pointer-events:none;display:none}
#plan.labels #labels{display:block}
#labels text{font-family:var(--sans);font-weight:500;fill:#26322A;paint-order:stroke;stroke:rgba(255,255,255,.88);stroke-linejoin:round}
#labels text.dim{display:none}
.ghost{fill:none;stroke:var(--blue);stroke-dasharray:4 3;vector-effect:non-scaling-stroke;stroke-width:1.6}
.topbar{position:absolute;left:12px;right:64px;top:10px;z-index:3;display:grid;gap:7px;justify-items:start}
.topbar .chips{max-width:100%}
.mapctl{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;gap:7px;z-index:3}
.mapctl button{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:40px;font-size:17px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05);padding:0}
.mapctl button.txt{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.mapctl .sep{height:4px}
.mapctl .compass{position:relative}
.mapctl .compass svg{width:26px;height:26px;display:block;margin:auto;transition:transform .15s}
.mapctl .compass.turned{border-color:var(--ink)}
.mapctl .rotbtn{display:none}
@media (hover:hover) and (pointer:fine){.mapctl .rotbtn{display:block}}
@media (prefers-reduced-motion: reduce){.mapctl .compass svg{transition:none}}
.legend{position:absolute;left:12px;bottom:12px;z-index:3;background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--ink-2);display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.18)}
.legend .lg-neu{border:1.6px dashed var(--blue);background:transparent}
.legend .lg-st{background:var(--red);width:8px;height:8px;border:0}
.legend .lg-stripe{background:repeating-linear-gradient(45deg,#A6B14C 0 3px,#fff 3px 6px)}
.legend .lg-kahl{border:1.5px dashed #8A6A3A;background:transparent}
.legend .lg-ein{border:1.2px dotted #8D988F;background:transparent}
.legend b{font-weight:600;color:var(--ink)}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:96px;z-index:4;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);width:max-content;max-width:calc(100% - 24px)}
.banner.on{display:flex}
.banner button{border:0;border-radius:9px;padding:7px 12px;background:var(--paper);color:var(--ink);font-weight:600}
.banner button.ghostbtn{background:transparent;color:var(--paper);font-weight:500}

/* Blatt */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:var(--sheet-shadow);max-height:80%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet .inner{overflow:auto;padding:10px 20px 22px}
.sheet .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:22px;color:var(--ink-3);width:40px;height:40px;z-index:1}
@media (min-width:900px){
  .app.sheet-open .mapctl{right:410px}
  .sheet{left:auto;right:16px;bottom:16px;top:16px;width:380px;max-height:none;border-radius:18px;transform:translateX(calc(100% + 24px))}
  .sheet .grab{display:none}
}
.p-name{font:400 30px/1.1 var(--serif);margin:6px 40px 2px 0}
.p-sorte{font-size:15px;color:var(--ink-2)}
.p-bot{font:italic 17px/1.3 var(--serif);color:var(--ink-2);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.tag{font-size:12px;border-radius:20px;padding:3px 10px;border:1px solid var(--line);color:var(--ink-2)}
.tag.neu{border-color:var(--blue);color:var(--blue);border-style:dashed}
.tag.st{border-color:var(--red);color:var(--red)}
.tag.unsicher{background:var(--sage-soft);border-color:transparent}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0;font-size:14px}
dl.facts dt{color:var(--ink-3)}
dl.facts dd{margin:0}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.inh{color:var(--ink-3);font-size:12px}
.note{background:var(--sage-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.block{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.block h3{font:400 20px/1.2 var(--serif);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.block h3 .grow{flex:1}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 14px;font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent);margin-left:auto}
.btn:disabled{opacity:.5;cursor:default}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0 12px}
.months span{font-size:10px;text-align:center;color:var(--ink-3);padding:5px 0 7px;border-radius:5px;background:var(--sage-soft);position:relative}
.months span.on{color:var(--ink);font-weight:600}
.months span.now{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.months span i{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);display:flex;gap:1px}
.months span i b{width:4px;height:4px;border-radius:50%;display:block}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tasks li{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:14px}
.tasks .when{font-size:12px;color:var(--ink-3);padding-top:1px}
.ttag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;margin-right:6px}
.hints{margin:12px 0 0;padding:0 0 0 16px;font-size:13px;color:var(--ink-2)}
.hints li{margin:3px 0}
.muted{color:var(--ink-3);font-size:13px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--sage-soft)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* Formular */
form.edit{display:grid;gap:12px;margin-top:8px}
form.edit label,.fld{display:grid;gap:4px;font-size:12px;color:var(--ink-3)}
form.edit input[type=text],form.edit input[type=password],form.edit input[type=number],form.edit input[type=date],form.edit select,form.edit textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;font-size:15px;color:var(--ink)}
form.edit textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatches button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.swatches .none{background:repeating-linear-gradient(45deg,var(--paper) 0 4px,var(--line) 4px 6px)}
.mtoggle{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.mtoggle button{border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:10.5px;padding:6px 0;color:var(--ink-2)}
.mtoggle button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mtoggle.inherited button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 35%,var(--paper));border-color:transparent;color:var(--ink)}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-size:13px}

/* Listen */
.scroll{position:absolute;inset:0;overflow:auto;padding:14px 18px 30px}
.wrap{max-width:760px;margin:0 auto}
.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-size:15px}
h2.grp{font:400 22px/1.2 var(--serif);margin:20px 0 6px}
h2.grp small{font:13px var(--sans);color:var(--ink-3);margin-left:6px}
ul.plist,ul.tlist{list-style:none;margin:0;padding:0}
ul.plist li button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px}
.dot{width:18px;height:18px;border-radius:50%;flex:none;border:1.5px solid rgba(0,0,0,.2)}
.dot.neu{border:1.6px dashed var(--blue);background:transparent!important}
.pl-main{flex:1;min-width:0}
.pl-main b{font-weight:500}
.pl-main span{color:var(--ink-3);font-size:13px;margin-left:6px}
.pl-main em{display:block;font:italic 14px var(--serif);color:var(--ink-3)}
.pl-side{font-size:12px;color:var(--ink-3);white-space:nowrap}
ul.tlist li{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
ul.tlist input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--sage);flex:none}
ul.tlist .t-main{flex:1;min-width:0}
ul.tlist .done .t-text{color:var(--ink-3);text-decoration:line-through}
ul.tlist .t-title{font-weight:500}
ul.tlist .t-sub{color:var(--ink-2);font-size:14px;margin-top:2px}
ul.tlist .t-meta{margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
ul.tlist .del{border:0;background:none;color:var(--ink-3);font-size:18px;width:32px;height:32px;flex:none}
.pill{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.adopted{font-size:12.5px;color:var(--sage);font-weight:600}
.addtodo{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:10px 0 4px}
@media (max-width:520px){.addtodo{grid-template-columns:1fr auto}.addtodo input{grid-column:1/-1}}
.addtodo input{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px}
.addtodo select{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 8px}
.mnav{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.mnav h2{font:400 28px/1.1 var(--serif);margin:0;flex:1;text-align:center}
.mnav button{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:40px;height:40px;font-size:18px}
.mnav .today{width:auto;padding:0 12px;font-size:13px}
.empty{color:var(--ink-3);padding:14px 2px}
.tnew{width:100%;margin:6px 0 2px;padding:11px 14px}
h2.grp.over{color:var(--red)}
.pill.over{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
ul.tlist li.tap{cursor:pointer}
ul.tlist li.tap:hover .t-title{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
ul.tlist .t-hint{color:var(--ink-3);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.tlist .chev{color:var(--ink-3);font-size:20px;line-height:20px;flex:none;align-self:center}
ul.tlist .done .t-hint{display:none}
.moverow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tdesc{margin-top:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;color:var(--ink)}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.pchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:20px;background:var(--paper);font-size:13px;color:var(--ink)}
.pchip button{border:0;background:none;color:inherit;font:inherit;padding:4px 10px}
.pchip .pc-x{padding:4px 9px 4px 2px;color:var(--ink-3);font-size:15px}
.pchip .pc-go+.pc-x{margin-left:-6px}
details.donebox summary{cursor:pointer;color:var(--ink-3);font-size:14px;padding:14px 2px;list-style:none}
details.donebox summary::before{content:"▸ ";}
details.donebox[open] summary::before{content:"▾ ";}

/* Fotos */
.ftop{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.grid button{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--sage-soft)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 5px;font-size:11px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.bigimg{width:100%;border-radius:12px;display:block;margin-top:6px;background:var(--sage-soft)}
.upprev{display:flex;gap:6px;flex-wrap:wrap}
.upprev img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.meter{font-size:12px;color:var(--ink-3);margin-top:18px}


nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--panel)}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-3)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs .badge{font-size:10px;background:var(--red);color:#fff;border-radius:10px;padding:0 5px;margin-left:3px}
.toast{position:absolute;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:12px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.on{opacity:1}

/* ================= iOS Liquid Glass ================= */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --tint:#2F7D4F; --tint-ink:#fff;
  --bg-1:#EEF3EA; --bg-2:#F7E3EE; --bg-3:#E2ECF6;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.78); --glass-thin:rgba(255,255,255,.34);
  --glass-edge:rgba(255,255,255,.75); --glass-line:rgba(38,50,42,.08);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25);
  --glass-shadow:0 10px 30px rgba(30,45,35,.12), 0 1px 3px rgba(30,45,35,.08);
  --fill:rgba(38,50,42,.06); --fill-2:rgba(38,50,42,.1);
  --blur:blur(22px) saturate(185%);
  --head-h:56px; --nav-h:64px; --nav-gap:10px; --nav-space:calc(var(--nav-h) + var(--nav-gap) * 2);
  --line:rgba(38,50,42,.1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tint:#6FCF8E; --tint-ink:#0E1A12;
    --bg-1:#141A16; --bg-2:#241A22; --bg-3:#16202A;
    --glass:rgba(40,46,42,.5); --glass-strong:rgba(36,42,38,.82); --glass-thin:rgba(255,255,255,.06);
    --glass-edge:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.08);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(255,255,255,.04);
    --glass-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.13); --line:rgba(255,255,255,.1);
  }

:root[data-theme="dark"]{
  --tint:#6FCF8E; --tint-ink:#0E1A12;
  --bg-1:#141A16; --bg-2:#241A22; --bg-3:#16202A;
  --glass:rgba(40,46,42,.5); --glass-strong:rgba(36,42,38,.82); --glass-thin:rgba(255,255,255,.06);
  --glass-edge:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.08);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(255,255,255,.04);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
  --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.13); --line:rgba(255,255,255,.1);
}
body{font-size:16px;letter-spacing:-.01em;
  background:radial-gradient(60% 45% at 10% 8%,var(--bg-2),transparent 70%),radial-gradient(55% 50% at 95% 35%,var(--bg-3),transparent 70%),radial-gradient(70% 60% at 30% 100%,var(--bg-1),transparent 70%),var(--paper);background-attachment:fixed}

/* gemeinsames Glas */
header,nav.tabs,.seg,.chips button,.mapctl button,.legend,.banner,.sheet,.toast,.btn,.search,ul.tlist,ul.plist,.mnav button,.pchip,.sheet .x{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* Rahmen: Inhalt läuft unter Kopf- und Tableiste */
.app{display:block}
main{position:absolute;inset:0}
header{position:absolute;left:0;right:0;top:0;z-index:5;height:var(--head-h);align-items:center;padding:0 18px;
  background:var(--glass);border-bottom:.5px solid var(--glass-line);box-shadow:inset 0 -1px 0 rgba(255,255,255,.15)}
header h1{font:700 20px/1 var(--serif);letter-spacing:-.025em}
header .sub{font-size:15px;color:var(--ink-3)}
header .status{font-size:13px}

nav.tabs{position:absolute;z-index:5;left:max(12px,calc(50% - 260px));right:max(12px,calc(50% - 260px));bottom:var(--nav-gap);height:var(--nav-h);
  border:.5px solid var(--glass-edge);border-radius:calc(var(--nav-h) / 2);background:var(--glass);box-shadow:var(--glass-hi),var(--glass-shadow);padding:5px;gap:2px}
nav.tabs button{border-radius:calc((var(--nav-h) - 10px) / 2);font-size:11px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
nav.tabs button svg{width:24px;height:24px;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--tint);background:var(--glass-strong);box-shadow:var(--glass-hi),0 2px 8px rgba(0,0,0,.06)}
nav.tabs .badge{background:#FF3B30;font-weight:700}

.scroll{padding:calc(var(--head-h) + 16px) 16px calc(var(--nav-space) + 24px)}
.toast{bottom:calc(var(--nav-space) + 8px)}

/* Plan-Overlays */
.topbar{top:calc(var(--head-h) + 10px)}
.mapctl{top:calc(var(--head-h) + 10px)}
.legend{bottom:calc(var(--nav-space) + 2px)}
.banner{top:calc(var(--head-h) + 92px)}
#planWrap{background:transparent}

/* Segmente */
.seg{background:var(--fill-2);border:0;border-radius:999px;padding:3px;box-shadow:none;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.topbar .seg,#v-todo .seg{background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow)}
.seg button{border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:var(--glass-hi),0 2px 8px rgba(0,0,0,.1)}

/* Chips */
.chips{padding:3px 2px 6px}
.chips button{background:var(--glass);border:.5px solid var(--glass-edge);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink);box-shadow:var(--glass-hi),0 2px 8px rgba(0,0,0,.06)}
.chips button[aria-pressed="true"]{background:var(--tint);border-color:transparent;color:var(--tint-ink)}
.chips button.now{border:.5px solid var(--glass-edge);box-shadow:var(--glass-hi),0 0 0 1.5px var(--tint) inset}
.chips button.now[aria-pressed="true"]{box-shadow:none}

/* Kartenknöpfe */
.mapctl{gap:8px}
.mapctl button{width:44px;height:44px;border-radius:50%;background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow);font-size:19px}
.mapctl button.txt{font-size:9.5px;letter-spacing:.04em}
.mapctl .compass.turned{border-color:var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow),0 0 0 2px var(--tint) inset}
.legend{background:var(--glass);border:.5px solid var(--glass-edge);border-radius:18px;box-shadow:var(--glass-hi),var(--glass-shadow);padding:9px 14px;color:var(--ink)}
.banner{background:rgba(20,26,22,.62);color:#fff;border:.5px solid rgba(255,255,255,.18);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 12px 32px rgba(0,0,0,.25);padding:8px 8px 8px 18px}
.banner button{border-radius:999px;padding:8px 16px;background:#fff;color:#14201A}
.banner button.ghostbtn{background:rgba(255,255,255,.12);color:#fff}

/* Blatt */
.sheet{z-index:7;left:8px;right:8px;bottom:8px;border-radius:30px;background:var(--glass-strong);border:.5px solid var(--glass-edge);box-shadow:var(--glass-hi),0 20px 60px rgba(0,0,0,.22);max-height:calc(100% - var(--head-h) - 20px);transition:transform .32s cubic-bezier(.2,.9,.25,1.05)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin-top:7px}
.sheet .inner{padding:8px 20px 22px}
.sheet .x{width:32px;height:32px;right:14px;top:14px;border-radius:50%;background:var(--fill);font-size:18px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
@media (min-width:900px){
  .sheet{top:calc(var(--head-h) + 12px);bottom:12px;right:12px;left:auto;width:390px;max-height:none;border-radius:30px}
  .app.sheet-open .mapctl{right:414px}
}
.p-name{font:700 28px/1.12 var(--serif);letter-spacing:-.03em}
.p-bot{font:italic 16px/1.3 var(--sans)}
.block{border-top:.5px solid var(--line)}
.block h3{font:600 17px/1.2 var(--sans);letter-spacing:-.02em}
.tag{background:var(--fill);border-color:transparent;font-weight:500;padding:4px 11px}
.tag.neu{background:transparent}
.tag.st{background:color-mix(in srgb,var(--red) 12%,transparent);border-color:transparent}
.note{background:var(--fill);border-radius:16px}
.months span{background:var(--fill);border-radius:7px}
.months span.now{outline-color:var(--tint)}

/* Knöpfe */
.btn{background:var(--glass);border:.5px solid var(--glass-edge);border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:var(--glass-hi),0 2px 8px rgba(0,0,0,.06)}
.btn.sm{border-radius:999px;padding:6px 13px;font-size:13.5px}
.btn.primary{background:var(--tint);color:var(--tint-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px color-mix(in srgb,var(--tint) 35%,transparent)}
.btn.danger{color:#FF3B30;background:color-mix(in srgb,#FF3B30 10%,transparent);border-color:transparent;box-shadow:none}
.linkbtn{color:var(--tint);font-weight:500;font-size:14px}

/* Formulare */
form.edit label,.fld{font-size:13px;font-weight:500;color:var(--ink-2)}
form.edit input[type=text],form.edit input[type=password],form.edit input[type=number],form.edit input[type=date],form.edit select,form.edit textarea{background:var(--fill);border:0;border-radius:14px;padding:11px 13px;font-size:16px}
form.edit input:focus,form.edit select:focus,form.edit textarea:focus{outline:none;box-shadow:0 0 0 2px var(--tint)}
.mtoggle button{background:var(--fill);border:0;border-radius:8px}
.mtoggle button[aria-pressed="true"]{background:var(--accent)}
.search{background:var(--glass);border:.5px solid var(--glass-edge);border-radius:999px;padding:11px 18px;box-shadow:var(--glass-hi),var(--glass-shadow);font-size:16px}
ul.tlist input[type=checkbox],.checks input[type=checkbox]{accent-color:var(--tint)}
ul.tlist input[type=checkbox]{width:22px;height:22px;border-radius:50%}

/* Gruppierte Listen */
h2.grp{font:700 21px/1.2 var(--serif);letter-spacing:-.025em;margin:26px 4px 8px}
h2.grp small{font-size:14px}
ul.plist,ul.tlist{background:var(--glass);border:.5px solid var(--glass-edge);border-radius:22px;box-shadow:var(--glass-hi),var(--glass-shadow);overflow:hidden}
ul.plist li button{padding:12px 16px;border-bottom:.5px solid var(--line)}
ul.tlist li{padding:13px 14px 13px 16px;border-bottom:.5px solid var(--line)}
ul.plist li:last-child button,ul.tlist li:last-child{border-bottom:0}
ul.tlist li.tap:active{background:var(--fill)}
ul.tlist li.tap:hover .t-title{text-decoration:none}
ul.tlist .t-title{font-weight:600}
.pill{background:var(--fill);border-color:transparent;padding:2px 9px;font-weight:500}
.pill.over{background:color-mix(in srgb,var(--red) 12%,transparent)}
.pchip{background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--glass-hi)}
.empty{padding:16px 6px}
.tnew{padding:13px 18px;font-size:16px}
details.donebox summary{padding:18px 6px;font-weight:500}
.mnav h2{font:700 24px/1.1 var(--serif);letter-spacing:-.025em}
.mnav button{width:44px;height:44px;border-radius:50%;background:var(--glass);border:.5px solid var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow)}
.mnav .today{border-radius:999px}
.grid{gap:8px}
.grid button{border-radius:16px}
.thumbs button{border-radius:14px}
.bigimg{border-radius:18px}

.pl-main em{font:italic 14px var(--sans)}
.toast{background:rgba(20,26,22,.66);color:#fff;border:.5px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* Ohne Unschärfe-Unterstützung: deckender */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.92);--glass-strong:#fff}
}
@media (prefers-reduced-transparency: reduce){
  :root{--glass:var(--panel);--glass-strong:var(--panel)}
}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}nav.tabs button{transition:none}}
.acct{margin-left:4px;border:.5px solid var(--glass-edge);background:var(--glass);box-shadow:var(--glass-hi);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tint);white-space:nowrap;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.acct.on{color:var(--ink-2)}
.acct .av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--tint-ink);font-size:11px;margin-right:6px;vertical-align:-6px}
@media (max-width:430px){header .sub{display:none}header .status{display:none}.acct{margin-left:auto}.acct .nm{display:none}.acct .av{margin:0}}
.setup{max-width:520px;margin:calc(var(--head-h) + 30px) auto 0;padding:0 18px}
.setup .card{background:var(--glass);border:.5px solid var(--glass-edge);border-radius:22px;box-shadow:var(--glass-hi),var(--glass-shadow);padding:18px 20px}
.offline{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--head-h) + 6px);z-index:6;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(20,26,22,.66);color:#fff;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.hidden,[hidden]{display:none!important}
</style>

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function sorteTxt(p){ return p.sorte ? (p.sorte.length > 14 || /Stämmchen/.test(p.sorte) ? p.sorte : "‚"+p.sorte+"‘") : ""; }
function inBed(x,y){ try{ const pt=svg.createSVGPoint(); pt.x=x; pt.y=y; return bedPath && bedPath.isPointInFill(pt); }catch(e){ return false; } }
function areaAt(x,y){ const pt=svg.createSVGPoint(); pt.x=x; pt.y=y;

  return "garten"; }
function colorName(hex, list){ const f=[...list].find(c=>c[0].toLowerCase()===String(hex).toLowerCase()); return f?f[1]:""; }
function monthRange(ms){
  if(!ms || !ms.length) return "";
  const s=[...ms].sort((a,b)=>a-b), parts=[]; let st=s[0], pr=s[0];
  for(let i=1;i<=s.length;i++){ const v=s[i]; if(v===pr+1){ pr=v; continue; } parts.push(st===pr?MSHORT[st-1]:MSHORT[st-1]+"–"+MSHORT[pr-1]); st=v; pr=v; }
  return parts.join(", ");
}
function careKeyFor(p){ if(p.pflege) return p.pflege; const n=(p.name||"").toLowerCase(); const r=CARE_RULES.find(([re])=>re.test(n)); return r?r[1]:null; }

function catOf(p){

  const k=careKeyFor(p);

  if (k && CAT_OF[k]) return CAT_OF[k];

}

/* Blüte und Laub: eigener Wert der Pflanze vor Artwert; alte Felder (farbe) werden gelesen */
function legacyLeaf(p){ return p.farbe && /Laub/i.test(p.farbname||"") ? p.farbe : null; }
function legacyBloom(p){ return p.farbe && !/Laub/i.test(p.farbname||"") ? p.farbe : null; }

function careTasksOf(p,m){ const c=spec(p); return c ? c.aufgaben.filter(a=>a.m.includes(m)) : []; }

/* ---------- Darstellung je Ansicht ---------- */
function paint(p){
  const isNew = p.status==="neu" || p.typ==="platzhalter";
  const base = TYPE_STYLE[p.typ] || TYPE_STYLE.staude;
  if (p.typ==="objekt") return {fill:base.fill, op:.95, stroke:base.stroke, dash:null, dim:state.view==="art"&&!artMatch(p)};
  if (state.view==="all"){
    if (isNew) return {fill:bloomColor(p)||"#FFFFFF", op:.5, stroke:"#2F5BD3", dash:"4 3"};
    const f = p.typ==="gehoelz" ? leafColor(p) : (bloomColor(p) || leafColor(p));
    return {fill:f, op:.92, stroke:darken(f)};
  }
  if (state.view==="month"){
    const m=state.month;
    if (isNew) return {fill:"none", op:0, stroke:"#2F5BD3", dash:"4 3"};
    if (bloomMonths(p).includes(m)){ const b=bloomColor(p); return b ? {fill:b, op:.95, stroke:darken(b)} : {fill:"url(#stripe)", op:1, stroke:"#556B4B"}; }
    if (leafyIn(p,m)){ const l=leafColor(p); return {fill:l, op:.85, stroke:darken(l)}; }
    if (leafType(p)==="sommergruen") return {fill:"#E9E2D6", op:.35, stroke:"#8A6A3A", dash:"3 3"};
    return {fill:"none", op:0, stroke:"#8D988F", dash:"1.5 3"};
  }
  if (state.view==="art"){
    const f = bloomColor(p) || leafColor(p);
    return artMatch(p) ? {fill:f, op:.95, stroke:"#172918", sw:2.2} : {fill:f, op:.9, stroke:darken(f), dim:true};
  }
  if (state.view==="care"){
    const t = isNew ? [] : careTasksOf(p, state.month);
    if (t.length){ const c=TASK[t[0].typ].c; return {fill:c, op:.9, stroke:darken(c), sw:t.length>1?2.4:1.2}; }
    const f = bloomColor(p) || leafColor(p);
    return {fill:f, op:.9, stroke:darken(f), dim:true};
  }
}
function artMatch(p){
  if (!state.cat && !state.species) return true;
  if (state.species) return speciesKey(p)===state.species;
  return catOf(p)===state.cat;
}

/* ---------- Zoom, Drehen & Verschieben ---------- */
let vb = {x:0,y:0,w:1440,h:900};
const world = document.getElementById("world");
const ROT_C = {x:600, y:460};            // Drehpunkt: Gartenmitte
const NORTH = 45;                         // Nordpfeil im Grundriss: 45° rechts von oben
let rot = 0, lastRot = null;
const baseTexts = [...svg.querySelectorAll(".base text")].map(t=>[t, t.getAttribute("transform")||""]);
function rotPt(p, deg){ const a=deg*Math.PI/180, dx=p.x-ROT_C.x, dy=p.y-ROT_C.y;
  return {x:ROT_C.x+dx*Math.cos(a)-dy*Math.sin(a), y:ROT_C.y+dx*Math.sin(a)+dy*Math.cos(a)}; }
function normDeg(d){ d%=360; if(d>180) d-=360; if(d<=-180) d+=360; return d; }
function applyVB(){
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const scale = Math.min(svg.clientWidth / vb.w, svg.clientHeight / vb.h) || 1;
  svg.classList.toggle("labels", scale > 2.1);
  const fs = 12 / scale;
  gLabels.setAttribute("font-size", fs.toFixed(2));
  gLabels.setAttribute("stroke-width", (3/scale).toFixed(2));
  const r0 = Math.round(rot*100)/100;
  gLabels.querySelectorAll("text").forEach(t=>{ const r=+t.dataset.r, x=+t.dataset.x, y=+t.dataset.cy + Math.min(r*0.35, fs*0.35);
    t.setAttribute("y", y.toFixed(1)); if (r0) t.setAttribute("transform", `rotate(${-r0} ${x} ${y.toFixed(1)})`); else t.removeAttribute("transform"); });
  if (lastRot !== r0){
    lastRot = r0;
    if (r0) world.setAttribute("transform", `rotate(${r0} ${ROT_C.x} ${ROT_C.y})`); else world.removeAttribute("transform");
    baseTexts.forEach(([t,o])=>{ if (r0) t.setAttribute("transform", (o+` rotate(${-r0})`).trim()); else if (o) t.setAttribute("transform", o); else t.removeAttribute("transform"); });
    $("#needle").style.transform = `rotate(${NORTH + r0}deg)`;
    $("#compass").classList.toggle("turned", Math.abs(r0) > .5);
  }
}
function fit(box, pad=.08){
  const W=svg.clientWidth||1, H=svg.clientHeight||1, ar=W/H;
  let w=box.w*(1+pad*2), h=box.h*(1+pad*2);

}
function fitWorld(box, pad){

  const xs=cs.map(c=>c.x), ys=cs.map(c=>c.y);
  fit({x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys)}, pad);
}
function fitAll(){ fitWorld({x:30,y:60,w:1140,h:840},.02); }
function fitBed(){ const b=bedPath.getBBox(); fitWorld({x:b.x,y:b.y-30,w:b.width,h:b.height+30},.04); }
function toSvg(cx, cy){ const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function toWorld(cx, cy){ return rot ? rotPt(toSvg(cx,cy), -rot) : toSvg(cx,cy); }
function rotateAt(deg, cx, cy){

function zoomTo(p){ const d=Math.max((p.d||.5),.5)*PX; const w=Math.max(220,d*8); const c=rotPt({x:p.x*PX,y:p.y*PX},rot); fit({x:c.x-w/2, y:c.y-w/2*0.62, w, h:w*0.62},0); }
const wrap = $("#planWrap"); const ptrs = new Map(); let gesture = null;
wrap.addEventListener("pointerdown", e => {
  try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY});
  const plantEl = e.target.closest && e.target.closest(".plant");
  if (ptrs.size === 1){
    gesture = (state.mode==="move" && plantEl && plantEl.dataset.id===state.sel) ? {type:"drag"} : {type:"pan", plantId: plantEl ? plantEl.dataset.id : null, moved:false};
  } else if (ptrs.size === 2){
    const [a,b]=[...ptrs.values()]; gesture = {type:"pinch", dist: Math.hypot(a.x-b.x,a.y-b.y), mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}, ang: Math.atan2(b.y-a.y,b.x-a.x), acc:0, turning:false};
  }

wrap.addEventListener("pointermove", e => {

  const prev = {x:p.x, y:p.y}; p.x=e.clientX; p.y=e.clientY;
  if (gesture.type==="pan"){
    if (Math.hypot(p.x-p.sx,p.y-p.sy) > 6) gesture.moved = true;
    if (!gesture.moved) return;
    wrap.classList.add("dragging");
    const a=toSvg(prev.x,prev.y), b=toSvg(p.x,p.y); vb.x -= b.x-a.x; vb.y -= b.y-a.y; applyVB();

  } else if (gesture.type==="pinch" && ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const dist=Math.hypot(a.x-b.x,a.y-b.y); const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};

wrap.addEventListener("pointerup", endPtr); wrap.addEventListener("pointercancel", endPtr);
wrap.addEventListener("wheel", e => { e.preventDefault(); if (e.shiftKey || e.altKey){ rotateAt((e.deltaY||e.deltaX)*0.15, e.clientX, e.clientY); return; } zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX, e.clientY); }, {passive:false});
wrap.addEventListener("dblclick", e => zoomAt(1.8, e.clientX, e.clientY));
$("#zin").onclick = () => zoomAt(1.5); $("#zout").onclick = () => zoomAt(1/1.5);
$("#compass").onclick = () => resetRotation();
$("#rotL").onclick = () => rotateAt(-15); $("#rotR").onclick = () => rotateAt(15);
document.querySelectorAll(".mapctl [data-fit]").forEach(b => b.onclick = () => b.dataset.fit==="bed" ? fitBed() : fitAll());
window.addEventListener("resize", () => applyVB());
function onTap(plantId, cx, cy){
  if (state.mode==="add"){
    const s = toWorld(cx,cy);
    state.pendingNew = Object.assign({name:"", typ:"staude", status:"bestand", stuetze:false, d:.5}, state.template||{}, {x:+(s.x/PX).toFixed(2), y:+(s.y/PX).toFixed(2), beet: areaAt(s.x,s.y)});
    state.template=null;
    setMode("view"); drawGhost(); openEdit(null); return;
  }
  if (state.mode==="move") return;
  if (state.mode==="pick"){ if(plantId){ state.pick.has(plantId)?state.pick.delete(plantId):state.pick.add(plantId); drawPlant(plantId); pickBanner(); } return; }
  if (plantId) select(plantId); else closeSheet();

function renderControls(){
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.mode===state.view)));
  const mc=$("#monthChips"), cc=$("#catChips"), sc=$("#speciesChips");

  if (state.view==="art"){
    const counts={}; state.plants.forEach(p=>{ const c=catOf(p); counts[c]=(counts[c]||0)+1; });
    cc.innerHTML = `<button type="button" data-cat="" aria-pressed="${!state.cat}">Alle</button>` +
      Object.entries(CATS).filter(([k])=>counts[k]).map(([k,v])=>`<button type="button" data-cat="${k}" aria-pressed="${state.cat===k}">${v}<span class="n">${counts[k]}</span></button>`).join("");

/* ---------- Zeichnen ---------- */
function drawAll(){

  [...state.plants.values()].sort((a,b)=>(b.d||0)-(a.d||0)).forEach(p => drawPlant(p.id, true));
  applyVB();
}
function drawPlant(id, fresh){
  const p = state.plants.get(id); if (!p) return;
  const x=(p._x ?? p.x)*PX, y=(p._y ?? p.y)*PX, r=Math.max(.25,(p.d||.5))/2*PX;
  let g = fresh ? null : gPlants.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!g){
    g = document.createElementNS(NS,"g"); g.dataset.id=id; g.setAttribute("class","plant");
    g.innerHTML = `<ellipse class="ring"/><ellipse class="body"/><circle class="stk"/><title></title>`;
    gPlants.appendChild(g);
    const t=document.createElementNS(NS,"text"); t.dataset.id=id; t.setAttribute("text-anchor","middle"); gLabels.appendChild(t);
  }
  const st = paint(p);
  g.classList.toggle("sel", state.sel===id || (state.mode==="pick" && !!state.pick && state.pick.has(id)));
  g.style.opacity = st.dim ? .18 : 1;
  const ring=g.querySelector(".ring"), body=g.querySelector(".body"), stk=g.querySelector(".stk");
  const rx = p.b ? p.b/2*PX : r, ry = r;
  body.setAttribute("cx",x); body.setAttribute("cy",y); body.setAttribute("rx",rx); body.setAttribute("ry",ry);
  body.setAttribute("fill",st.fill); body.setAttribute("fill-opacity",st.op);
  body.setAttribute("stroke",st.stroke); body.setAttribute("stroke-width",st.sw||(st.dash?1.5:1.1));
  if (st.dash) body.setAttribute("stroke-dasharray",st.dash); else body.removeAttribute("stroke-dasharray");
  ring.setAttribute("cx",x); ring.setAttribute("cy",y); ring.setAttribute("rx",rx+2.2); ring.setAttribute("ry",ry+2.2); ring.setAttribute("fill","none");
  if (p.stuetze && state.view==="all"){ stk.setAttribute("cx",x+r*.7); stk.setAttribute("cy",y-r*.7); stk.setAttribute("r",Math.max(1.6,r*.16)); stk.setAttribute("fill","#C8424F"); stk.style.display=""; }
  else stk.style.display="none";
  g.querySelector("title").textContent = p.name + (p.sorte ? " "+p.sorte : "");
  const t = gLabels.querySelector(`text[data-id="${CSS.escape(id)}"]`);
  if (t){ t.setAttribute("x",x); t.dataset.x=x; t.dataset.cy=y; t.dataset.r=r; t.textContent=(p.name||"Ohne Namen")+(p.unsicher?" ?":""); t.classList.toggle("dim", !!st.dim); }
}
function drawGhost(){
  gGhost.textContent=""; const p=state.pendingNew; if(!p) return;
  const c=document.createElementNS(NS,"circle"); c.setAttribute("class","ghost"); c.setAttribute("cx",p.x*PX); c.setAttribute("cy",p.y*PX); c.setAttribute("r",(p.d||.5)/2*PX); gGhost.appendChild(c);
}

/* ---------- Blatt ---------- */
function select(id, zoom){ const prev=state.sel; state.sel=id; if(prev) drawPlant(prev); drawPlant(id); if(zoom) zoomTo(state.plants.get(id)); openDetail(id); }
function openSheet(html){ $("#sheetBody").innerHTML=html; $("#sheet").classList.add("on"); $(".app").classList.add("sheet-open"); $("#sheet .inner").scrollTop=0; }
function closeSheet(){ state.openTodo=null; $("#sheet").classList.remove("on"); $(".app").classList.remove("sheet-open"); const prev=state.sel; state.sel=null; if(prev) drawPlant(prev); state.pendingNew=null; drawGhost(); }
$("#sheetClose").onclick = () => { if(state.mode==="move") cancelMove(); closeSheet(); };

function plantFotos(id){ return [...state.fotos.values()].filter(f=>f.plantId===id).sort((a,b)=>String(b.datum).localeCompare(String(a.datum))); }
function openDetail(id){
  const p=state.plants.get(id); if(!p) return;
  const c=spec(p), w=canWrite();
  const bm=bloomMonths(p), bc=bloomColor(p), lc=leafColor(p);
  const facts=[["Art", esc(TYPES[p.typ]||"Pflanze")]];
  if (p.hoehe) facts.push(["Höhe", fmtLen(p.hoehe)]);
  if (p.d) facts.push([p.b?"Maße":"Durchmesser", p.b ? Math.round(p.b*100)+" × "+Math.round(p.d*100)+" cm" : Math.round(p.d*100)+" cm"]);
  if (p.typ!=="objekt"){
    facts.push(["Blüte", bm.length ? `${bc?`<span class="sw" style="background:${esc(bc)}"></span>${esc(colorName(bc,BLOOM_COLORS)||"Farbe")}`:`<span class="inh">Farbe offen</span>`} · ${monthRange(bm)}${bloomMonthsOwn(p)?"":` <span class="inh">(Artwert)</span>`}` : `<span class="inh">keine Angabe</span>`]);
    facts.push(["Laub", `<span class="sw" style="background:${esc(lc)}"></span>${esc(colorName(lc,LEAF_COLORS)||"grün")} · ${esc(LAUB[leafType(p)])}`]);
  }
  facts.push(["Bereich", esc(AREAS[p.beet]||"–")]);
  const fotos=plantFotos(id);
  openSheet(`
    <h2 class="p-name">${esc(p.name||"Ohne Namen")}</h2>
    ${p.sorte?`<div class="p-sorte">${esc(sorteTxt(p))}</div>`:""}
    ${p.botanisch&&p.botanisch!==p.name?`<div class="p-bot">${esc(p.botanisch)}</div>`:""}
    <div class="tags"><span class="tag ${p.status==="neu"?"neu":""}">${p.status==="neu"?"Neu geplant":"Bestand"}</span>${p.stuetze?`<span class="tag st">braucht Stütze</span>`:""}${p.unsicher?`<span class="tag unsicher">Angaben unsicher</span>`:""}</div>
    <dl class="facts">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${p.notiz?`<div class="note">${esc(p.notiz)}</div>`:""}
    ${w?`<div class="actions"><button class="btn primary" id="bEdit">Bearbeiten</button><button class="btn" id="bMove">Verschieben</button><button class="btn" id="bTodo">+ ToDo</button></div>`:""}
    <div class="block"><h3><span class="grow">Fotos</span>${state.assets?`<button class="btn sm" id="bFoto">+ Foto</button>`:""}</h3>
      ${fotos.length?`<div class="thumbs">${fotos.map(f=>`<button type="button" data-foto="${esc(f.id)}"><img src="${esc(KG.blobUrl(f.asset))}" alt="${esc(p.name)}" loading="lazy"></button>`).join("")}</div>`:`<div class="muted">Noch keine Fotos.</div>`}
    </div>
    ${careHtml(p)}`);
  if (w){ $("#bEdit").onclick=()=>openEdit(id); $("#bMove").onclick=()=>startMove(id); $("#bTodo").onclick=()=>openTodoEdit(null,{plantIds:[id], titel:p.name||""}); }
  if ($("#bFoto")) $("#bFoto").onclick=()=>pickFotos({plantId:id, bereich:p.beet||"staudenbeet"});
  $("#sheetBody").querySelectorAll("[data-foto]").forEach(b=>b.onclick=()=>openFoto(b.dataset.foto));
}
function careHtml(p){
  const c=spec(p);
  if(!c||!c.aufgaben) return `<div class="block"><h3>Pflege</h3><div class="muted">Für diese Pflanze sind noch keine Pflegehinweise hinterlegt.</div></div>`;
  const byM={}; c.aufgaben.forEach(a=>a.m.forEach(m=>{ (byM[m] ||= new Set()).add(a.typ); }));
  const months=MSHORT.map((s,i)=>{ const set=byM[i+1]; return `<span class="${set?"on":""} ${i+1===nowM?"now":""}" title="${MONTHS[i]}">${s}${set?`<i>${[...set].map(ty=>`<b style="background:${TASK[ty].c}"></b>`).join("")}</i>`:""}</span>`; }).join("");
  const tasks=[...c.aufgaben].sort((a,b)=>a.m[0]-b.m[0]).map(a=>`<li><span class="when">${monthRange(a.m)}</span><span><span class="ttag" style="color:${TASK[a.typ].c}">${TASK[a.typ].n}</span>${esc(a.text)}</span></li>`).join("");
  return `<div class="block"><h3>Pflege</h3><div class="months">${months}</div><ul class="tasks">${tasks}</ul>
    ${(c.hinweise||[]).length?`<ul class="hints">${c.hinweise.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>`:""}
    <div class="muted" style="margin-top:10px">Allgemeine Hinweise für ${esc(c.titel)}. Sorte und Standort können abweichen.</div></div>`;
}

function swatchRow(id, list, cur){
  return `<div class="swatches" id="${id}"><button type="button" class="none" data-c="" aria-pressed="${!cur}" aria-label="keine / Standard" title="keine / Standard"></button>` +
    list.map(([c,n])=>`<button type="button" data-c="${c}" style="background:${c}" aria-label="${esc(n)}" title="${esc(n)}" aria-pressed="${String(cur||"").toLowerCase()===c.toLowerCase()}"></button>`).join("")+`</div>`;
}
function openEdit(id){
  const isNew=!id; const p = isNew ? state.pendingNew : {...state.plants.get(id)}; if(!p) return;
  const c=spec(p);
  let bc = p.bluetenfarbe || legacyBloom(p) || "", lc = p.laubfarbe || legacyLeaf(p) || "";
  let bm = bloomMonthsOwn(p) ? [...p.bluehmonate] : null;
  const defBm = c&&c.bluete ? c.bluete.m||[] : [];
  const defLeaf = c&&c.laub ? LAUB[c.laub] : null;
  openSheet(`
    <h2 class="p-name">${isNew?"Neue Pflanze":"Bearbeiten"}</h2>
    <form class="edit" id="editForm">
      <label>Name<input type="text" name="name" value="${esc(p.name)}" required placeholder="z. B. Funkie"></label>
      <div class="row2"><label>Sorte<input type="text" name="sorte" value="${esc(p.sorte)}" placeholder="z. B. Black Tower"></label>
        <label>Botanischer Name<input type="text" name="botanisch" value="${esc(p.botanisch)}" placeholder="z. B. Hosta"></label></div>
      <div class="row2"><label>Höhe (cm)<input type="number" name="hoehe" min="0" step="any" value="${p.hoehe??""}"></label>
        <label>Durchmesser (cm)<input type="number" name="dcm" min="10" step="any" value="${Math.round((p.d??.5)*100)}"></label></div>
      <div class="row2"><label>Art<select name="typ">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${p.typ===k?"selected":""}>${v}</option>`).join("")}</select></label>
        <label>Status<select name="status"><option value="bestand" ${p.status!=="neu"?"selected":""}>Bestand</option><option value="neu" ${p.status==="neu"?"selected":""}>Neu geplant</option></select></label></div>
      <label>Bereich<select name="beet"><option value="">–</option>${Object.entries(AREAS).map(([k,v])=>`<option value="${k}" ${p.beet===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <div class="fld">Blütenfarbe${swatchRow("swB",BLOOM_COLORS,bc)}</div>
      <div class="fld">Blühmonate <span id="bmHint"></span><div class="mtoggle" id="bmT"></div></div>
      <div class="fld">Laubfarbe${swatchRow("swL",LEAF_COLORS,lc)}</div>
      <label>Laub im Winter<select name="laub"><option value="">${defLeaf?`Standard: ${defLeaf}`:"Standard"}</option>${Object.entries(LAUB).map(([k,v])=>`<option value="${k}" ${p.laub===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <div class="checks"><label><input type="checkbox" name="stuetze" ${p.stuetze?"checked":""}> braucht Stütze</label><label><input type="checkbox" name="unsicher" ${p.unsicher?"checked":""}> Angaben unsicher</label></div>
      <label>Notiz<textarea name="notiz">${esc(p.notiz)}</textarea></label>
      <div class="actions"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" id="bCancel">Abbrechen</button>${isNew?"":`<button class="btn danger" type="button" id="bDel">Löschen</button>`}</div>
    </form>`);
  const renderBm=()=>{ const cur=bm||defBm; const el=$("#bmT"); el.classList.toggle("inherited", !bm);
    el.innerHTML=MSHORT.map((s,i)=>`<button type="button" data-m="${i+1}" aria-pressed="${cur.includes(i+1)}">${s}</button>`).join("");
    $("#bmHint").innerHTML = bm ? (defBm.length?`· <button type="button" class="linkbtn" id="bmReset">Artwert verwenden (${monthRange(defBm)})</button>`:"") : (defBm.length?`<span class="inh">· Artwert, antippen zum Anpassen</span>`:`<span class="inh">· antippen zum Auswählen</span>`);
    if ($("#bmReset")) $("#bmReset").onclick=()=>{ bm=null; renderBm(); }; };
  renderBm();
  $("#bmT").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const m=+b.dataset.m; if(!bm) bm=[...defBm]; bm = bm.includes(m) ? bm.filter(x=>x!==m) : [...bm,m].sort((a,b)=>a-b); renderBm(); };
  const sw=(sel,set)=>{ $(sel).onclick=e=>{ const b=e.target.closest("button"); if(!b) return; set(b.dataset.c); $(sel).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); }; };
  sw("#swB", v=>bc=v); sw("#swL", v=>lc=v);
  $("#bCancel").onclick = () => isNew ? closeSheet() : openDetail(id);
  if (!isNew) $("#bDel").onclick = () => delPlant(id);
  $("#editForm").onsubmit = async e => {
    e.preventDefault(); const f=new FormData(e.target);
    const doc = { name:(f.get("name")||"").trim(), sorte:(f.get("sorte")||"").trim(), botanisch:(f.get("botanisch")||"").trim(),
      hoehe: f.get("hoehe") ? Number(f.get("hoehe")) : null, d: Math.max(.1,(Number(f.get("dcm"))||50)/100),
      typ:f.get("typ"), status:f.get("status"), beet:f.get("beet")||"", stuetze:!!f.get("stuetze"), unsicher:!!f.get("unsicher"),
      notiz:(f.get("notiz")||"").trim(), bluetenfarbe:bc||null, laubfarbe:lc||null, laub:f.get("laub")||null,
      bluehmonate: bm, x:p.x, y:p.y, pflege:p.pflege||null, b:p.b||null, form:p.form||null };
    Object.keys(doc).forEach(k=>{ if(doc[k]===""||doc[k]===null||(doc[k]===false&&k==="unsicher")) delete doc[k]; });
    await savePlant(isNew?null:id, doc);
  };
}

/* ---------- Verschieben / Hinzufügen ---------- */
function setMode(m, text){ state.mode=m; svg.classList.toggle("moving", m==="move"); svg.classList.toggle("picking", m==="pick"); $("#banner").classList.toggle("on", m!=="view"); $("#bannerText").textContent=text||""; $("#bannerOk").hidden = !(m==="move"||m==="pick"); }
function startMove(id){ const p=state.plants.get(id); $("#sheet").classList.remove("on"); zoomTo(p); setMode("move","Ziehe die Pflanze an ihren neuen Platz."); }
function cancelMove(){ const p=state.plants.get(state.sel); if(p){ delete p._x; delete p._y; drawPlant(state.sel); } setMode("view"); }
$("#bannerCancel").onclick = () => { if(state.mode==="move"){ cancelMove(); openDetail(state.sel); } else if(state.mode==="pick") backToDraft(false); else setMode("view"); };
$("#bannerOk").onclick = async () => {
  if (state.mode==="pick"){ backToDraft(true); return; }
  const id=state.sel, p=state.plants.get(id); setMode("view");
  if (p && p._x!=null){
    const x=+p._x.toFixed(2), y=+p._y.toFixed(2); delete p._x; delete p._y;
    const a=areaAt(x*PX,y*PX); const upd={x,y}; if (a!=="garten" || !p.beet) upd.beet=a;
    try{ await state.db.doc("plants/"+id).update(upd); toast("Neuer Platz gespeichert"); } catch(err){ handleWriteError(err); drawPlant(id); }
  }
  openDetail(id);
};
$("#addBtn").onclick = () => { closeSheet(); showView("plan"); setMode("add","Tippe auf die Stelle, an der die Pflanze steht."); };

/* ---------- Speichern ---------- */
function canWrite(){ return state.canWrite !== false && !!state.db; }
async function savePlant(id, doc){
  if (!state.db){ toast("Speichern ist in dieser Ansicht nicht möglich"); return; }
  try{
    if (id){ await state.db.doc("plants/"+id).set(doc); toast("Gespeichert"); openDetail(id); }
    else { const nid="n"+Date.now().toString(36); await state.db.doc("plants/"+nid).set(doc); state.pendingNew=null; drawGhost(); toast("Pflanze hinzugefügt");
      state.plants.set(nid,{...doc,id:nid}); drawPlant(nid,false); select(nid); }
  }catch(err){ handleWriteError(err); }
}
async function delPlant(id){
  const p=state.plants.get(id); if (!confirm(`„${p.name}“ wirklich löschen? Das lässt sich nicht rückgängig machen.`)) return;
  try{ await state.db.doc("plants/"+id).delete(); closeSheet(); toast("Gelöscht"); }catch(err){ handleWriteError(err); }
}
function handleWriteError(err){
  if (err && err.code==="invalid_argument"){ state.canWrite=false; applyWriteUI(); toast("Du kannst hier nur ansehen, nicht bearbeiten"); }
  else if (err && err.code==="quota_exceeded") toast("Speicher voll: bitte nicht mehr benötigte Einträge löschen");
  else toast("Speichern fehlgeschlagen, bitte noch einmal versuchen");
}
function applyWriteUI(){ $("#addBtn").hidden=!canWrite(); $("#fotoAdd").hidden=!state.assets; }

/* ---------- Pflanzenliste ---------- */
function renderList(){
  const q=state.q.toLowerCase().trim(), f=state.filter;
  const arr=[...state.plants.values()].filter(p=>{
    if (f==="neu" && p.status!=="neu") return false; if (f==="st" && !p.stuetze) return false; if (f==="uns" && !p.unsicher) return false;
    if (f==="nobloom" && (p.typ==="objekt" || (bloomMonths(p).length && bloomColor(p)))) return false;
    if (q && !`${p.name} ${p.sorte||""} ${p.botanisch||""} ${p.notiz||""}`.toLowerCase().includes(q)) return false; return true; });
  const groups={}; arr.forEach(p=>{ (groups[p.beet||"_"] ||= []).push(p); });
  $("#plist").innerHTML = Object.entries(groups).map(([k,items])=>{
    items.sort((a,b)=>(a.name||"").localeCompare(b.name||"","de"));
    return `<h2 class="grp">${esc(AREAS[k]||"Ohne Bereich")}<small>${items.length}</small></h2><ul class="plist">`+items.map(p=>{
      const fill=p.typ==="gehoelz"?leafColor(p):(bloomColor(p)||leafColor(p)), bm=bloomMonths(p);
      return `<li><button type="button" data-id="${esc(p.id)}"><span class="dot ${p.status==="neu"?"neu":""}" style="background:${fill}"></span>
      <span class="pl-main"><b>${esc(p.name||"Ohne Namen")}</b>${p.sorte?`<span>${esc(sorteTxt(p))}</span>`:""}${p.botanisch&&p.botanisch!==p.name?`<em>${esc(p.botanisch)}</em>`:""}</span>
      <span class="pl-side">${bm.length?"Blüte "+monthRange(bm):""}${p.stuetze?" · Stütze":""}</span></button></li>`; }).join("")+`</ul>`;
  }).join("") || `<div class="empty">Keine Pflanze passt zur Suche.</div>`;
}
$("#q").oninput = e => { state.q=e.target.value; renderList(); };
$("#filters").onclick = e => { const b=e.target.closest("button"); if(!b) return; state.filter=b.dataset.f; $("#filters").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); renderList(); };
$("#plist").onclick = e => { const b=e.target.closest("button[data-id]"); if(!b) return; showView("plan"); requestAnimationFrame(()=>select(b.dataset.id,true)); };

/* ---------- Aufgaben ---------- */
function recFor(m){
  const groups=new Map();
  state.plants.forEach(p=>{ if(p.status==="neu"||p.typ==="platzhalter") return; const k=careKeyFor(p); if(!k) return; (groups.get(k)||groups.set(k,[]).get(k)).push(p.id); });
  const out=[];
  groups.forEach((ids,k)=>{ const c=state.care.get(k); if(!c||!c.aufgaben) return; c.aufgaben.forEach((a,i)=>{ if(a.m.includes(m)) out.push({rid:`${YEAR}-${String(m).padStart(2,"0")}-${k}-${i}`, key:k, titel:c.titel, a, ids}); }); });
  const order=["schnitt","duengen","teilen","pflege","schutz"];
  return out.sort((x,y)=>order.indexOf(x.a.typ)-order.indexOf(y.a.typ) || x.titel.localeCompare(y.titel,"de"));
}
function adoptedIds(){ const s=new Set(); state.todos.forEach(t=>{ if(t.fromCare) s.add(t.fromCare); }); return s; }
const NOWKEY = YEAR*12 + nowM;
function jahrOf(t){
  if (!t.monat) return null;
  if (t.jahr) return t.jahr;
  if (t.order && t.order > 1e12){ const c=new Date(t.order); return c.getFullYear() + (t.monat < c.getMonth()+1 ? 1 : 0); }
  return YEAR;
}
function keyOf(t){ return t.monat ? jahrOf(t)*12 + t.monat : null; }
function titleOf(t){ return t.titel || t.text || "Ohne Titel"; }
function descOf(t){ return t.titel ? (t.beschreibung||"") : ""; }
function monthLabel(m, y){ return MONTHS[m-1] + (y && y!==YEAR ? " "+y : ""); }
function nextMonth(){ return nowM===12 ? {monat:1, jahr:YEAR+1} : {monat:nowM+1, jahr:YEAR}; }
function isOverdue(t){ return !t.done && t.monat && keyOf(t) < NOWKEY; }
function plantName(id){ const p=state.plants.get(id); return p ? (p.name||"Ohne Namen")+(p.sorte?" "+sorteTxt(p):"") : null; }
function plantChip(id, removable){ const n=plantName(id); if(!n) return "";
  return `<span class="pchip"><button type="button" class="pc-go" data-goplant="${esc(id)}">${esc(n)}</button>${removable?`<button type="button" class="pc-x" data-rmplant="${esc(id)}" aria-label="${esc(n)} entfernen">×</button>`:""}</span>`; }

function renderTodos(){
  const w=canWrite();
  const todos=[...state.todos.values()].sort((a,b)=>(a.order??1e15)-(b.order??1e15));
  const open=todos.filter(t=>!t.done);
  const overdue=open.filter(isOverdue).sort((a,b)=>keyOf(a)-keyOf(b));
  const anytime=open.filter(t=>!t.monat);
  const future=open.filter(t=>t.monat && keyOf(t)>=NOWKEY);
  const done=todos.filter(t=>t.done).sort((a,b)=>(keyOf(b)??0)-(keyOf(a)??0));
  const dueNow=overdue.length + future.filter(t=>keyOf(t)===NOWKEY).length;
  const badge=$("#todoBadge"); badge.hidden=!dueNow; badge.textContent=dueNow;
  const m=state.tMonth, rec=recFor(m), adopted=adoptedIds();
  document.querySelectorAll("#todoSeg button").forEach(b=>{ b.setAttribute("aria-pressed",String(b.dataset.t===state.tTab));
    b.textContent = b.dataset.t==="plan" ? `Geplante ToDos (${open.length})` : `Empfohlene Pflege (${rec.filter(r=>!adopted.has(r.rid)).length})`; });
  $("#mnav").hidden = state.tTab==="plan";
  $("#mnav").innerHTML = `<button type="button" data-mnav="-1" aria-label="Vorheriger Monat">‹</button><h2>${MONTHS[m-1]}</h2><button type="button" data-mnav="1" aria-label="Nächster Monat">›</button>${m!==nowM?`<button type="button" class="today" data-mnav="0">Heute</button>`:""}`;
  const li = (t, extra) => { const n=(t.plantIds||[]).filter(i=>state.plants.has(i)).length, d=descOf(t);
    return `<li class="tap ${t.done?"done":""}" data-open="${esc(t.id)}"><input type="checkbox" data-id="${esc(t.id)}" ${t.done?"checked":""} ${w?"":"disabled"} aria-label="Erledigt">
     <div class="t-main"><div class="t-text t-title">${esc(titleOf(t))}</div>${d?`<div class="t-hint">${esc(d)}</div>`:""}
     ${(extra||n||t.fromCare)?`<div class="t-meta">${extra||""}${t.fromCare?`<span class="pill">Pflegeempfehlung</span>`:""}${n?`<button type="button" class="linkbtn" data-plants="${esc(t.plantIds.join(","))}">Im Plan zeigen (${n})</button>`:""}</div>`:""}
     ${extra && w && !t.done ? `<div class="moverow"><button type="button" class="btn sm" data-mv="next" data-tid="${esc(t.id)}">In den ${MONTHS[nextMonth().monat-1]} verschieben</button><button type="button" class="btn sm" data-mv="year" data-tid="${esc(t.id)}">Für ${Math.max(jahrOf(t),YEAR)+1} vormerken</button></div>`:""}
     </div><span class="chev" aria-hidden="true">›</span></li>`; };
  const list=(arr, ex)=>`<ul class="tlist">${arr.map(t=>li(t, ex&&ex(t))).join("")}</ul>`;
  if (state.tTab==="plan"){
    let html = w ? `<button type="button" class="btn primary tnew" id="todoNew">+ Neues ToDo</button>` : "";
    if (overdue.length) html += `<h2 class="grp over">Unerledigt<small>${overdue.length}</small></h2>` + list(overdue, t=>`<span class="pill over">${monthLabel(t.monat, jahrOf(t)===YEAR?null:jahrOf(t))}</span>`);
    html += `<h2 class="grp">Jederzeit<small>${anytime.length}</small></h2>` + (anytime.length?list(anytime):`<div class="empty">Keine offenen ToDos.</div>`);
    const groups=new Map(); future.forEach(t=>{ const k=keyOf(t); (groups.get(k)||groups.set(k,[]).get(k)).push(t); });
    if (!groups.has(NOWKEY)) groups.set(NOWKEY, []);
    [...groups.keys()].sort((a,b)=>a-b).forEach(k=>{ const arr=groups.get(k), y=Math.floor((k-1)/12), mm=k-y*12;
      html += `<h2 class="grp">${monthLabel(mm,y)}${k===NOWKEY?` <small>diesen Monat</small>`:""}<small>${arr.length||""}</small></h2>` +
        (arr.length?list(arr):`<div class="empty">Nichts geplant. Unter „Empfohlene Pflege“ findest du Vorschläge.</div>`); });
    if (done.length) html += `<details class="donebox"${state.doneOpen?" open":""}><summary>Erledigt (${done.length})</summary>${list(done, t=>t.monat?`<span class="pill">${monthLabel(t.monat,jahrOf(t))}</span>`:"")}</details>`;
    $("#tlist").innerHTML = html;
    const dbx=$("#tlist details.donebox"); if (dbx) dbx.ontoggle=()=>{ state.doneOpen=dbx.open; };
    if ($("#todoNew")) $("#todoNew").onclick=()=>openTodoEdit(null);
  } else {
    const groups={}; rec.forEach(r=>{ (groups[r.a.typ] ||= []).push(r); });
    $("#tlist").innerHTML = rec.length ? Object.entries(groups).map(([typ,arr])=>`<h2 class="grp"><span style="color:${TASK[typ].c}">${TASK[typ].n}</span><small>${arr.length}</small></h2><ul class="tlist">`+arr.map(r=>{
      const ad=adopted.has(r.rid);
      return `<li><div class="t-main"><div class="t-text"><span class="t-title">${esc(r.titel)}</span></div><div class="t-sub">${esc(r.a.text)}</div>
        <div class="t-meta"><button type="button" class="linkbtn" data-plants="${esc(r.ids.join(","))}">Im Plan zeigen (${r.ids.length})</button>
        ${ad?`<span class="adopted">✓ In geplanten ToDos</span>`:(w?`<button type="button" class="btn sm" data-adopt="${esc(r.rid)}">Übernehmen</button>`:"")}</div></div></li>`; }).join("")+`</ul>`).join("")
      + `<p class="muted" style="margin-top:16px">Allgemeine Empfehlungen je Pflanzenart. Übernommene Punkte erscheinen unter „Geplante ToDos“ und lassen sich dort abhaken.</p>`
      : `<div class="empty">Im ${MONTHS[m-1]} steht keine Pflege an.</div>`;
  }
  if (state.openTodo && $("#todoDetail") && $("#sheet").classList.contains("on")) openTodo(state.openTodo);
}
async function updTodo(id, upd, msg){ try{ await state.db.doc("todos/"+id).update(upd); if(msg) toast(msg); }catch(err){ handleWriteError(err); } }
async function moveTodo(id, how){ const t=state.todos.get(id); if(!t) return;
  if (how==="next"){ const n=nextMonth(); await updTodo(id,{monat:n.monat, jahr:n.jahr},`In den ${MONTHS[n.monat-1]} verschoben`); }
  else { const y=Math.max(jahrOf(t)||YEAR, YEAR)+1; await updTodo(id,{jahr:y},`Für ${MONTHS[t.monat-1]} ${y} vorgemerkt`); } }
function todoSheet(html){ const prev=state.sel; state.sel=null; if(prev) drawPlant(prev); openSheet(html); }

function openTodo(id){
  const t=state.todos.get(id); if(!t){ state.openTodo=null; return; }
  state.openTodo=id; const w=canWrite(), d=descOf(t), ov=isOverdue(t);
  const ids=(t.plantIds||[]).filter(i=>state.plants.has(i));
  const when = t.monat ? monthLabel(t.monat, jahrOf(t)) : "Jederzeit";
  todoSheet(`<div id="todoDetail">
    <h2 class="p-name">${esc(titleOf(t))}</h2>
    <div class="tags"><span class="tag ${ov?"st":""}">${esc(when)}${ov?" · überfällig":""}</span>${t.done?`<span class="tag unsicher">Erledigt</span>`:""}${t.fromCare?`<span class="tag">Pflegeempfehlung</span>`:""}</div>
    ${d?`<div class="tdesc">${esc(d)}</div>`:`<div class="muted" style="margin-top:10px">Keine Beschreibung.${w?" Über „Bearbeiten“ ergänzen.":""}</div>`}
    ${ids.length?`<div class="block"><h3><span class="grow">Pflanzen</span><button type="button" class="btn sm" id="tdShow">Im Plan zeigen</button></h3><div class="chiplist">${ids.map(i=>plantChip(i,false)).join("")}</div></div>`:""}
    ${w?`<div class="actions"><button class="btn primary" type="button" id="tdDone">${t.done?"Wieder öffnen":"Erledigt"}</button><button class="btn" type="button" id="tdEdit">Bearbeiten</button><button class="btn danger" type="button" id="tdDel">Löschen</button></div>
    ${ov?`<div class="moverow"><button type="button" class="btn sm" id="tdNext">In den ${MONTHS[nextMonth().monat-1]} verschieben</button><button type="button" class="btn sm" id="tdYear">Für ${Math.max(jahrOf(t),YEAR)+1} vormerken</button></div>`:""}`:""}
  </div>`);
  const sb=$("#sheetBody");
  sb.querySelectorAll("[data-goplant]").forEach(b=>b.onclick=()=>{ state.openTodo=null; showPlants([b.dataset.goplant]); });
  if ($("#tdShow")) $("#tdShow").onclick=()=>{ state.openTodo=null; showPlants(ids); };
  if (!w) return;
  $("#tdDone").onclick=()=>updTodo(id,{done:!t.done}, t.done?"Wieder geöffnet":"Erledigt ✓");
  $("#tdEdit").onclick=()=>openTodoEdit(id);
  $("#tdDel").onclick=async e=>{ const b=e.currentTarget; if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Wirklich löschen?"; return; }
    try{ await state.db.doc("todos/"+id).delete(); state.openTodo=null; closeSheet(); toast("ToDo gelöscht"); }catch(err){ handleWriteError(err); } };
  if ($("#tdNext")) $("#tdNext").onclick=()=>moveTodo(id,"next");
  if ($("#tdYear")) $("#tdYear").onclick=()=>moveTodo(id,"year");
}

function openTodoEdit(id, preset){
  const t = id ? state.todos.get(id) : null;
  state.openTodo=null;
  state.todoDraft = { id, from: $("#v-plan").classList.contains("on") ? "plan" : "todo",
    titel: t ? titleOf(t) : "", beschreibung: t ? descOf(t) : "",
    monat: t ? (t.monat||0) : nowM, jahr: t ? (jahrOf(t)||YEAR) : YEAR,
    plantIds: t ? [...(t.plantIds||[])] : [], ...(preset||{}) };
  renderDraft();
}
function renderDraft(){
  const d=state.todoDraft, isNew=!d.id, yrs=[YEAR,YEAR+1,YEAR+2]; if (d.jahr && !yrs.includes(d.jahr)) yrs.unshift(d.jahr);
  todoSheet(`
    <h2 class="p-name">${isNew?"Neues ToDo":"ToDo bearbeiten"}</h2>
    <form class="edit" id="todoEditForm">
      <label>Kurztitel<input type="text" name="titel" value="${esc(d.titel)}" required maxlength="80" placeholder="z. B. Rosen anhäufeln"></label>
      <label>Beschreibung<textarea name="beschreibung" rows="4" placeholder="Was genau ist zu tun? Material, Hinweise …">${esc(d.beschreibung)}</textarea></label>
      <div class="row2"><label>Monat<select name="monat"><option value="0" ${!d.monat?"selected":""}>Jederzeit</option>${MONTHS.map((n,i)=>`<option value="${i+1}" ${d.monat===i+1?"selected":""}>${n}</option>`).join("")}</select></label>
        <label id="jahrL" ${!d.monat?"hidden":""}>Jahr<select name="jahr">${yrs.map(y=>`<option value="${y}" ${d.jahr===y?"selected":""}>${y}</option>`).join("")}</select></label></div>
      <div class="fld">Pflanzen<div class="chiplist" id="tdChips">${d.plantIds.map(i=>plantChip(i,true)).join("") || `<span class="muted">Keine Pflanzen zugeordnet.</span>`}</div>
        <div><button type="button" class="btn sm" id="tdPick">${d.plantIds.length?"Im Plan ändern":"Im Plan auswählen"}</button></div></div>
      <div class="actions"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" id="tdCancel">Abbrechen</button>${isNew?"":`<button class="btn danger" type="button" id="tdDel2">Löschen</button>`}</div>
    </form>`);
  const f=$("#todoEditForm");
  const grab=()=>{ const fd=new FormData(f); d.titel=(fd.get("titel")||"").trim(); d.beschreibung=(fd.get("beschreibung")||"").trim(); d.monat=Number(fd.get("monat"))||0; d.jahr=Number(fd.get("jahr"))||YEAR; };
  f.monat.onchange=()=>{ $("#jahrL").hidden = f.monat.value==="0"; };
  $("#tdChips").onclick=e=>{ const x=e.target.closest("[data-rmplant]"); if(x){ grab(); d.plantIds=d.plantIds.filter(i=>i!==x.dataset.rmplant); renderDraft(); } };
  $("#tdPick").onclick=()=>{ grab(); startPick(); };
  $("#tdCancel").onclick=()=>{ const id=d.id; state.todoDraft=null; if(id) openTodo(id); else closeSheet(); };
  if ($("#tdDel2")) $("#tdDel2").onclick=async e=>{ const b=e.currentTarget; if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Wirklich löschen?"; return; }
    try{ await state.db.doc("todos/"+d.id).delete(); state.todoDraft=null; closeSheet(); toast("ToDo gelöscht"); }catch(err){ handleWriteError(err); } };
  f.onsubmit=async e=>{ e.preventDefault(); grab(); if(!d.titel) return;
    const old = d.id ? state.todos.get(d.id) : null;
    const doc = { titel:d.titel, done: old ? !!old.done : false, plantIds:d.plantIds, order: old?.order ?? Date.now() };
    if (d.beschreibung) doc.beschreibung=d.beschreibung;
    if (d.monat){ doc.monat=d.monat; doc.jahr=d.jahr; }
    if (old?.fromCare) doc.fromCare=old.fromCare;
    const id = d.id || "t"+Date.now().toString(36);
    try{ await state.db.doc("todos/"+id).set(doc); toast(d.id?"ToDo gespeichert":"ToDo angelegt"); state.todoDraft=null;
      if ($("#v-todo").classList.contains("on")) openTodo(id); else closeSheet(); }catch(err){ handleWriteError(err); } };
}
function startPick(){
  const d=state.todoDraft; state.pick=new Set(d.plantIds);
  $("#sheet").classList.remove("on"); $(".app").classList.remove("sheet-open");
  showView("plan"); setMode("pick", ""); pickBanner(); drawAll();
}
function pickBanner(){ const n=state.pick?.size||0; $("#bannerText").textContent = n ? `${n} ${n===1?"Pflanze":"Pflanzen"} gewählt · weitere antippen` : "Tippe die Pflanzen für dieses ToDo an."; }
function backToDraft(ok){
  const d=state.todoDraft; if (ok && d) d.plantIds=[...state.pick];
  state.pick=null; setMode("view"); drawAll();
  if (!d) return;
  if (d.from==="todo") showView("todo");

$("#todoSeg").onclick = e => { const b=e.target.closest("button"); if(!b) return; state.tTab=b.dataset.t; renderTodos(); };
$("#mnav").onclick = e => { const b=e.target.closest("[data-mnav]"); if(!b) return; const v=+b.dataset.mnav; state.tMonth = v===0 ? nowM : ((state.tMonth-1+v+12)%12)+1; renderTodos(); };
$("#tlist").onchange = async e => { const c=e.target.closest("input[type=checkbox][data-id]"); if(!c) return;
  try{ await state.db.doc("todos/"+c.dataset.id).update({done:c.checked}); }catch(err){ handleWriteError(err); renderTodos(); } };
$("#tlist").onclick = async e => {
  if (e.target.closest("input[type=checkbox]")) return;
  const pl=e.target.closest("[data-plants]"), ad=e.target.closest("[data-adopt]"), mv=e.target.closest("[data-mv]"), op=e.target.closest("[data-open]");
  if (pl){ showPlants(pl.dataset.plants.split(",")); return; }
  if (mv){ mv.disabled=true; await moveTodo(mv.dataset.tid, mv.dataset.mv); return; }
  if (ad){ const r=recFor(state.tMonth).find(x=>x.rid===ad.dataset.adopt); if(!r) return; ad.disabled=true;

    const doc={titel:`${r.titel.replace(/\s*\(.*\)$/,"")}: ${TASK[r.a.typ]?.n||"Pflege"}`, beschreibung:r.a.text, done:false, plantIds:r.ids, monat:state.tMonth, jahr:y, fromCare:r.rid, order:Date.now()};
    try{ await state.db.doc("todos/c"+Date.now().toString(36)).set(doc); toast("In geplante ToDos übernommen"); }catch(err){ handleWriteError(err); ad.disabled=false; } return; }
  if (op) openTodo(op.dataset.open);

function showPlants(ids){
  const ps=ids.map(i=>state.plants.get(i)).filter(Boolean); if(!ps.length) return; showView("plan");
  requestAnimationFrame(()=>{ const xs=ps.map(p=>p.x*PX), ys=ps.map(p=>p.y*PX), pad=60;
    fitWorld({x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2},0); select(ps[0].id); });
}

function renderAreaChips(){
