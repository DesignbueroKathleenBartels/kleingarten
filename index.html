  $("#areaChips").innerHTML = `<button type="button" data-a="all" aria-pressed="${state.area==="all"}">Alle<span class="n">${state.fotos.size}</span></button>` +
    Object.entries(AREAS).map(([k,v])=>`<button type="button" data-a="${k}" aria-pressed="${state.area===k}">${v}${cnt[k]?`<span class="n">${cnt[k]}</span>`:""}</button>`).join("");
}
function renderFotos(){
  renderAreaChips();
  const arr=[...state.fotos.values()].filter(f=>state.area==="all"||(f.bereich||"garten")===state.area).sort((a,b)=>String(b.datum).localeCompare(String(a.datum)) || (b.order||0)-(a.order||0));
  $("#fgrid").innerHTML = arr.length ? `<div class="grid">${arr.map(f=>{ const p=f.plantId&&state.plants.get(f.plantId);
      return `<button type="button" data-foto="${esc(f.id)}"><img src="${esc(KG.blobUrl(f.asset))}" alt="${esc(p?p.name:(AREAS[f.bereich]||"Foto"))}" loading="lazy"><span class="cap">${esc(p?p.name:(AREAS[f.bereich]||""))}${f.datum?" · "+esc(new Date(f.datum).toLocaleDateString("de-DE",{day:"numeric",month:"short"})):""}</span></button>`; }).join("")}</div>`
    : `<div class="empty">${state.assets?"Noch keine Fotos. Mit „+ Fotos“ kannst du Bilder hochladen und Pflanzen oder Bereichen zuordnen.":"Noch keine Fotos. Hochladen ist nur mit Bearbeitungsrecht möglich."}</div>`;
  if (state.assets && state.assets.list){ state.assets.list().then(r=>{ const u=r&&r.usage; if(u&&u.quotaBytes) $("#meter").textContent=`Speicher: ${(u.usedBytes/1048576).toFixed(1)} MB von ${(u.quotaBytes/1048576).toFixed(0)} MB belegt`; }).catch(()=>{}); }
}
$("#areaChips").onclick = e => { const b=e.target.closest("button"); if(!b) return; state.area=b.dataset.a; renderFotos(); };
$("#fgrid").onclick = e => { const b=e.target.closest("[data-foto]"); if(b) openFoto(b.dataset.foto); };
$("#fotoAdd").onclick = () => pickFotos({bereich: state.area!=="all"?state.area:"staudenbeet"});
function pickFotos(pre){ state.upload=pre; $("#fileIn").value=""; $("#fileIn").click(); }
$("#fileIn").onchange = () => { const files=[...$("#fileIn").files]; if(!files.length) return; openUpload(files, state.upload||{}); };
function plantOptions(bereich, cur){
  const arr=[...state.plants.values()].filter(p=>!bereich || (p.beet||"")===bereich).sort((a,b)=>(a.name||"").localeCompare(b.name||"","de"));
  return `<option value="">– keine bestimmte Pflanze –</option>`+arr.map(p=>`<option value="${esc(p.id)}" ${cur===p.id?"selected":""}>${esc(p.name||"Ohne Namen")}${p.sorte?" "+esc(sorteTxt(p)):""} (${esc(p.id)})</option>`).join("");
}
function openUpload(files, pre){
  const urls=files.map(f=>URL.createObjectURL(f)); const today=new Date().toISOString().slice(0,10);
  openSheet(`<h2 class="p-name">${files.length>1?files.length+" Fotos":"Foto"} hinzufügen</h2>
    <form class="edit" id="upForm"><div class="upprev">${urls.map(u=>`<img src="${u}" alt="">`).join("")}</div>
      <label>Bereich<select name="bereich" id="upArea">${Object.entries(AREAS).map(([k,v])=>`<option value="${k}" ${pre.bereich===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label>Pflanze (optional)<select name="plantId" id="upPlant">${plantOptions(pre.bereich, pre.plantId)}</select></label>
      <label>Datum<input type="date" name="datum" value="${today}"></label>
      <label>Notiz<textarea name="notiz" placeholder="z. B. Austrieb, Blüte, Schneckenfraß …"></textarea></label>
      <div class="actions"><button class="btn primary" type="submit" id="upGo">Hochladen</button><button class="btn" type="button" id="upCancel">Abbrechen</button></div>
      <div class="muted" id="upStatus"></div></form>`);
  $("#upArea").onchange = e => { $("#upPlant").innerHTML = plantOptions(e.target.value, null); };
  $("#upCancel").onclick = () => closeSheet();
  $("#upForm").onsubmit = async e => {
    e.preventDefault(); const f=new FormData(e.target); $("#upGo").disabled=true;
    let ok=0;
    for (let i=0;i<files.length;i++){
      $("#upStatus").textContent=`Lade ${i+1} von ${files.length} hoch …`;
      try{
        const blob = await shrink(files[i]);
        const r = await state.assets.upload(blob, {type: blob.type||"image/jpeg"});
        const id="f"+Date.now().toString(36)+i;
        const doc={asset:r.id, bereich:f.get("bereich")||"garten", datum:f.get("datum")||today, order:Date.now()};
        if (f.get("plantId")) doc.plantId=f.get("plantId"); const n=(f.get("notiz")||"").trim(); if(n) doc.notiz=n;
        await state.db.doc("fotos/"+id).set(doc); ok++;
      }catch(err){ const c=err&&err.code;
        toast(c==="unsupported_type"?"Dieses Bildformat wird nicht unterstützt. Bitte als JPEG speichern.":c==="too_large"?"Das Foto ist zu groß.":c==="quota_or_state"?"Der Fotospeicher ist voll.":"Hochladen fehlgeschlagen."); }
    }
    urls.forEach(u=>URL.revokeObjectURL(u));
    if (ok){ toast(ok===1?"Foto gespeichert":`${ok} Fotos gespeichert`); const pid=f.get("plantId"); if(pid && state.plants.has(pid)) openDetail(pid); else closeSheet(); }
    else $("#upGo").disabled=false;
  };
}
async function shrink(file){
  try{
    const bmp = await createImageBitmap(file); const max=1800; const k=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",.85));
  }catch(e){ return file; }
}
function openFoto(fid){
  const f=state.fotos.get(fid); if(!f) return; const p=f.plantId&&state.plants.get(f.plantId); const w=canWrite();
  openSheet(`<img class="bigimg" src="${esc(KG.blobUrl(f.asset))}" alt="">
    <dl class="facts"><dt>Datum</dt><dd>${f.datum?esc(new Date(f.datum).toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})):"–"}</dd>
      <dt>Bereich</dt><dd>${esc(AREAS[f.bereich]||"–")}</dd>
      <dt>Pflanze</dt><dd>${p?`<button type="button" class="linkbtn" id="fPlant">${esc(p.name)}${p.sorte?" "+esc(sorteTxt(p)):""}</button>`:"–"}</dd></dl>
    ${f.notiz?`<div class="note">${esc(f.notiz)}</div>`:""}
    ${w?`<form class="edit" id="fEdit"><label>Bereich<select name="bereich" id="feArea">${Object.entries(AREAS).map(([k,v])=>`<option value="${k}" ${f.bereich===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label>Pflanze<select name="plantId" id="fePlant">${plantOptions(f.bereich, f.plantId)}</select></label>
      <label>Notiz<textarea name="notiz">${esc(f.notiz)}</textarea></label>
      <div class="actions"><button class="btn primary" type="submit">Zuordnung speichern</button>${state.assets?`<button class="btn danger" type="button" id="fDel">Foto löschen</button>`:""}</div></form>`:""}`);
  if ($("#fPlant")) $("#fPlant").onclick=()=>{ showView("plan"); requestAnimationFrame(()=>select(p.id,true)); };
  if (!w) return;
  $("#feArea").onchange = e => { $("#fePlant").innerHTML = plantOptions(e.target.value, null); };
  $("#fEdit").onsubmit = async e => { e.preventDefault(); const d=new FormData(e.target);
    const doc={asset:f.asset, bereich:d.get("bereich"), datum:f.datum, order:f.order||0}; if(d.get("plantId")) doc.plantId=d.get("plantId"); const n=(d.get("notiz")||"").trim(); if(n) doc.notiz=n;
    try{ await state.db.doc("fotos/"+fid).set(doc); toast("Gespeichert"); openFoto(fid); }catch(err){ handleWriteError(err); } };
  if ($("#fDel")) $("#fDel").onclick = async () => { if(!confirm("Foto endgültig löschen?")) return;
    try{ await state.assets.delete(f.asset).catch(()=>{}); await state.db.doc("fotos/"+fid).delete(); closeSheet(); toast("Foto gelöscht"); }catch(err){ handleWriteError(err); } };
}

    <div class="tags"><span class="tag">${esc(u.email||"")}</span><span class="tag unsicher">darf bearbeiten</span></div>
    <div class="block"><h3>Passwort ändern</h3>
      <form class="edit" id="pwForm"><label>Neues Passwort<input type="password" name="pw" minlength="8" autocomplete="new-password" required></label>
        <div class="actions"><button class="btn sm" type="submit">Passwort speichern</button></div></form></div>
    <div class="block"><h3>Sicherung</h3>
      <p class="muted" style="font-size:14px;margin:0 0 10px">Alle Daten als Datei sichern oder eine Sicherung einspielen. Fotos sind in der Sicherung nicht enthalten.</p>
      <div class="actions" style="margin-top:0"><button class="btn sm" type="button" id="expBtn">Sicherung herunterladen</button><button class="btn sm" type="button" id="impBtn">Sicherung einspielen</button></div>
      <input type="file" id="impFile" accept="application/json,.json" hidden><div class="muted" id="impMsg" role="status"></div></div>
    <div class="actions"><button class="btn danger" type="button" id="logout">Abmelden</button></div>`);
  $("#pwForm").onsubmit=async e=>{ e.preventDefault(); try{ await KG.auth.setPassword(new FormData(e.target).get("pw")); toast("Passwort geändert"); e.target.reset(); }catch(err){ toast("Passwort konnte nicht geändert werden"); } };
  $("#logout").onclick=()=>KG.auth.signOut();
  $("#expBtn").onclick=()=>{ const blob=new Blob([JSON.stringify(KG.exportAll(),null,1)],{type:"application/json"}); const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=`kleingarten-sicherung-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
  $("#impBtn").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=async e=>{ const file=e.target.files[0]; if(!file) return;
    try{ const obj=JSON.parse(await file.text()); const n=Object.values(obj).reduce((s,v)=>s+Object.keys(v||{}).length,0);
      const b=$("#impBtn"); if(!b.dataset.sure){ b.dataset.sure="1"; b.dataset.n=n; b.textContent=`${n} Einträge einspielen?`; state.importObj=obj; $("#impMsg").textContent="Gleichnamige Einträge werden überschrieben. Zum Bestätigen noch einmal tippen."; b.onclick=doImport; return; } }
    catch(err){ $("#impMsg").textContent="Die Datei ist keine gültige Sicherung."; } };
  async function doImport(){ const b=$("#impBtn"); b.disabled=true;
    try{ const n=await KG.importAll(state.importObj,(i,t)=>{ $("#impMsg").textContent=`Spiele ein … ${i} von ${t}`; }); $("#impMsg").textContent=`${n} Einträge eingespielt.`; toast("Sicherung eingespielt"); }
    catch(err){ $("#impMsg").textContent="Einspielen fehlgeschlagen."; b.disabled=false; } }
}
$("#acct").onclick=()=>{ if($("#acct").hidden) return; openAcct(); };
function updOnline(){ $("#offline").hidden = navigator.onLine; }
window.addEventListener("online",updOnline); window.addEventListener("offline",updOnline);

/* ---------- Navigation ---------- */
function showView(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#viewTitle").textContent = {plan:"Plan",list:"Pflanzen",todo:"Aufgaben",foto:"Fotos"}[v];
  if (v!=="plan"){ if(state.mode==="move") cancelMove(); else if(state.mode==="pick"){ state.pick=null; setMode("view"); drawAll(); } else if(state.mode!=="view") setMode("view"); $("#sheet").classList.remove("on"); $(".app").classList.remove("sheet-open"); }
  if (v==="list") renderList(); if (v==="todo") renderTodos(); if (v==="foto") renderFotos();
  if (v==="plan") requestAnimationFrame(applyVB);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.v));

/* ---------- Start ---------- */
renderControls();
requestAnimationFrame(()=>fitBed());
(async () => {
  const [db, user, assets] = await Promise.all(["db","user","assets"].map(n => window.claude?.use?.(n) ?? null));
  renderAcct(); updOnline(); if (!KG.configured) $("#acct").hidden=true;
  if (!db){ $("#status").textContent=""; $("#acct").hidden=true;
    $("#v-plan").insertAdjacentHTML("beforeend",`<div class="setup"><div class="card"><h2 class="p-name" style="margin-top:0">Fast fertig</h2><p>Die App ist noch nicht mit der Datenbank verbunden. Trage in <code>js/config.js</code> die Supabase-Adresse und den Schlüssel ein.</p></div></div>`); return; }
  state.db=db; state.assets=assets||null;
  state.canWrite = user ? await user.can("data.write") : null;
  applyWriteUI();
  $("#status").textContent = state.canWrite ? "" : "Nur ansehen";
  const redraw = () => { drawAll(); renderControls(); if ($("#v-list").classList.contains("on")) renderList(); if ($("#v-todo").classList.contains("on")) renderTodos(); };
  db.collection("plants").onSnapshot(snap=>{
    const next=new Map(); snap.docs.forEach(d=>{ const v={...d.data(), id:d.id}; const old=state.plants.get(d.id);
      if (old && old._x!=null && state.mode==="move" && state.sel===d.id){ v._x=old._x; v._y=old._y; } next.set(d.id,v); });
    state.plants=next; redraw();
    if (state.sel && !state.plants.has(state.sel)) closeSheet();
    if (!$("#status").textContent || /Pflanzen/.test($("#status").textContent)) $("#status").textContent = state.plants.size+" Pflanzen";
  }, ()=>{ $("#status").textContent="Verbindung unterbrochen"; });
  db.collection("pflege").onSnapshot(snap=>{ state.care=new Map(snap.docs.map(d=>[d.id,d.data()])); redraw(); renderTodos();
    if (state.sel && $("#sheet").classList.contains("on") && !$("#editForm")) openDetail(state.sel); }, ()=>{});
  db.collection("info").onSnapshot(snap=>{ const d=snap.docs.find(x=>x.id==="wissen"); state.wissen=d?(d.data().text||""):""; }, ()=>{});
  db.collection("todos").onSnapshot(snap=>{ state.todos=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); renderTodos(); }, ()=>{});
  db.collection("fotos").onSnapshot(snap=>{ state.fotos=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); if ($("#v-foto").classList.contains("on")) renderFotos();
    if (state.sel && $("#sheet").classList.contains("on") && !$("#editForm") && !$("#upForm")) openDetail(state.sel); }, ()=>{});
})();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol==="https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => { const w=reg.installing; w && w.addEventListener("statechange", () => {
      if (w.state==="installed" && navigator.serviceWorker.controller) { const t=document.getElementById("toast"); t.textContent="Neue Version geladen"; t.classList.add("on"); setTimeout(()=>location.reload(),1200); } }); });
  }).catch(()=>{}));
}
</script>
